<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications - Eléa Guilmot</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/certifications.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="main-with-fixed-header">
        <section id="certifications">
            <div class="container">
                <h2 class="section-title">Mes Certifications</h2>
                <p class="section-subtitle">Les certifications que j'ai obtenues au cours de mon parcours</p>
                <script>
                    const certifications = [
                        {
                            titre: "MOOC de l'ANSSI",
                            organisme: "ANSSI",
                            date: "Obtenu",
                            description: "Formation aux fondamentaux de la cybersécurité dispensée par l'Agence Nationale de la Sécurité des Systèmes d'Information.",
                            image: `<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                                <rect x="0" y="0" width="680" height="380" fill="#f5f0e6"/>
                                <circle cx="340" cy="190" r="90" fill="#ffffff" stroke="#e8e4dd" stroke-width="2"/>
                                <path d="M 340 130 L 290 155 L 290 200 Q 290 240 340 260 Q 390 240 390 200 L 390 155 Z" fill="none" stroke="#b8956a" stroke-width="3" stroke-linejoin="round"/>
                                <path d="M 320 195 L 335 210 L 360 180" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                <text x="340" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" letter-spacing="2">ANSSI</text>
                                <text x="340" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#b8956a" letter-spacing="3">CYBERSECURITE</text>
                            </svg>`,
                            lienSite: "https://secnumacademie.gouv.fr/",
                            lienCertif: "documents/Certification MOOC ANSSI_Elea GUILMOT_25022026.pdf",
                            ouvrirNouvelOnglet: true
                        },
                        {
                            titre: "MOOC EBIOS Risk Manager",
                            organisme: "ANSSI",
                            date: "Obtenu",
                            description: "Méthode d'appréciation et de traitement des risques numériques publiée par l'ANSSI, référence en analyse de risques cyber.",
                            image: `<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                                <rect x="0" y="0" width="680" height="380" fill="#f5f0e6"/>
                                <circle cx="340" cy="190" r="90" fill="#ffffff" stroke="#e8e4dd" stroke-width="2"/>
                                <circle cx="340" cy="190" r="60" fill="none" stroke="#b8956a" stroke-width="2" stroke-dasharray="4 4"/>
                                <circle cx="340" cy="190" r="30" fill="none" stroke="#1a1a1a" stroke-width="2"/>
                                <circle cx="340" cy="190" r="6" fill="#b8956a"/>
                                <line x1="340" y1="100" x2="340" y2="115" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                                <line x1="340" y1="265" x2="340" y2="280" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                                <line x1="250" y1="190" x2="265" y2="190" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                                <line x1="415" y1="190" x2="430" y2="190" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
                                <text x="340" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" letter-spacing="2">EBIOS RM</text>
                                <text x="340" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#b8956a" letter-spacing="3">GESTION DES RISQUES</text>
                            </svg>`,
                            lienSite: "https://cyber.gouv.fr/la-methode-ebios-risk-manager",
                            lienCertif: "documents/Test_final___ANSSI_x_Club_EBIOS_04-03-2026.pdf",
                            ouvrirNouvelOnglet: true
                        },
                        {
                            titre: "MOOC de la CNIL",
                            organisme: "CNIL",
                            date: "Obtenu",
                            description: "Formation à la protection des données personnelles et au Règlement Général sur la Protection des Données (RGPD), dispensée par la CNIL.",
                            image: `<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                                <rect x="0" y="0" width="680" height="380" fill="#f5f0e6"/>
                                <circle cx="340" cy="190" r="90" fill="#ffffff" stroke="#e8e4dd" stroke-width="2"/>
                                <rect x="305" y="160" width="70" height="55" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
                                <path d="M 318 160 L 318 145 Q 318 130 340 130 Q 362 130 362 145 L 362 160" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
                                <circle cx="340" cy="185" r="6" fill="#b8956a"/>
                                <line x1="340" y1="190" x2="340" y2="205" stroke="#b8956a" stroke-width="2.5" stroke-linecap="round"/>
                                <text x="340" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a" letter-spacing="2">CNIL</text>
                                <text x="340" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#b8956a" letter-spacing="3">RGPD</text>
                            </svg>`,
                            lienSite: "https://atelier-rgpd.cnil.fr/",
                            lienCertif: "documents/Certification MOOC CNIL_Elea GUILMOT_08072026.pdf",
                            ouvrirNouvelOnglet: true
                        }
                    ];
                </script>

                <div class="certifications-grid" id="certifications-grid">
                    <!-- Les certifications sont générées automatiquement ici -->
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/layout.js"></script>

    <script>
        // Génération automatique des cartes certifications
        const grid = document.getElementById('certifications-grid');
        certifications.forEach(certif => {
            const targetAttr = certif.ouvrirNouvelOnglet ? 'target="_blank" rel="noopener noreferrer"' : '';

            // Détecte si c'est un SVG inline ou un chemin d'image
            const imageHTML = certif.image.trim().startsWith('<svg')
                ? certif.image
                : `<img src="${certif.image}" alt="${certif.titre}">`;

            // Bouton certificat affiché uniquement si lien différent de "#"
            const certifBtn = certif.lienCertif && certif.lienCertif !== '#'
                ? `<a href="${certif.lienCertif}" class="certif-link" ${targetAttr}>→ Voir le certificat</a>`
                : '';   

            const card = `
                <div class="certif-card">
                    <div class="certif-image">
                        ${imageHTML}
                    </div>
                    <div class="certif-content">
                        <div class="certif-meta">
                            <span class="certif-organisme">${certif.organisme}</span>
                            <span class="certif-date">${certif.date}</span>
                        </div>
                        <h3 class="certif-title">${certif.titre}</h3>
                        <p class="certif-description">${certif.description}</p>
                        <div class="certif-footer">
                            <a href="${certif.lienSite}" class="certif-link" ${targetAttr}>→ Site officiel</a>
                            ${certifBtn}
                        </div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', card);
        });
    </script>
</body>
</html>
