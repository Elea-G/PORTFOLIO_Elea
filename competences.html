<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compétences - Eléa Guilmot</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/competences.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="main-with-fixed-header">
        <section id="skills">
            <div class="container">
                <h2 class="section-title">Mes Compétences</h2>
                <p class="section-subtitle">Les technologies que je maîtrise dans le cadre du BTS SIO SLAM</p>
                <script>
                    const competences = [
                        {
                            categorie: "Base de données",
                            titre: "Rédaction de requêtes SQL",
                            description: "Gestion et exploitation de bases de données relationnelles"
                        },
                        {
                            categorie: "Business Intelligence",
                            titre: "Tableaux de bord",
                            description: "Conception et réalisation de tableaux de bord dynamiques"
                        },
                        {
                            categorie: "Développement Web",
                            titre: "HTML / CSS / JavaScript / PHP",
                            description: "Création de sites web responsives et interactifs"
                        },
                        {
                            categorie: "Logique applicative",
                            titre: "Modélisation de processus métiers",
                            description: "Création de configurateurs basés sur des scénarios de questions et l'application de formules"
                        }

                    ];
                </script>

                <div class="skills-container" id="skills-container">
                    <!-- Les compétences sont générées automatiquement ici -->
                </div>

                <div class="button-wrapper">
                    <a href="documents/Epreuve E5 - BTS SIO 2026.pdf" class="button-26" target="_blank" rel="noopener noreferrer">Consultez ma fiche E5</a>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/layout.js"></script>

    <script>
        // Génération automatique des cartes compétences
        const skillsContainer = document.getElementById('skills-container');
        competences.forEach(comp => {
            const card = `
                <div class="skill-card">
                    <div class="skill-icon">${comp.categorie}</div>
                    <h3 class="skill-title">${comp.titre}</h3>
                    <p class="skill-description">${comp.description}</p>
                </div>
            `;
            skillsContainer.insertAdjacentHTML('beforeend', card);
        });
    </script>
</body>
</html>
