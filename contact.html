<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Eléa Guilmot</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="main-with-fixed-header">
        <section id="contact">
            <div class="container">
                <h2 class="section-title">Contactez-moi</h2>
                <p class="section-subtitle">N'hésitez pas à me contacter pour toute question ou collaboration</p>
                <div class="contact-form">
                    <form id="contactForm" action="https://formspree.io/f/mbdwbrvk" method="POST">
                        <div class="form-group">
                            <label for="firstName">Prénom</label>
                            <input type="text" id="firstName" name="prenom" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Nom</label>
                            <input type="text" id="lastName" name="nom" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Adresse mail</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <input type="text" name="_gotcha" style="display:none">

                        <div class="form-group checkbox-group">
                            <label for="rgpd" class="checkbox-label">
                                <input type="checkbox" id="rgpd" name="rgpd" required>
                                <span>
                                    J'accepte que les informations saisies dans ce formulaire soient utilisées uniquement dans le cadre du traitement de ma demande de contact, conformément au RGPD.
                                    <a href="mentions-legales.html#donnees" target="_blank" rel="noopener noreferrer">Voir la politique de confidentialité.</a>
                                </span>
                            </label>
                        </div>

                        <div class="form-buttons">
                            <button type="button" class="reset-btn" id="resetBtn">Réinitialiser</button>
                            <button type="submit" id="submitBtn">Envoyer</button>
                        </div>
                    </form>

                    <div id="formSuccess" class="form-message form-message-success" style="display: none;">
                        <strong>✓ Message envoyé !</strong>
                    </div>
                    <div id="formError" class="form-message form-message-error" style="display: none;">
                        <strong>✗ Une erreur est survenue</strong>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="js/layout.js"></script>

    <script>
        const form = document.getElementById('contactForm');
        const successMsg = document.getElementById('formSuccess');
        const errorMsg = document.getElementById('formError');
        const submitBtn = document.getElementById('submitBtn');

        document.getElementById('resetBtn').addEventListener('click', function () {
            form.reset();
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi en cours...';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    successMsg.style.display = 'block';
                    form.reset();
                    form.style.display = 'none';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Envoyer';
            }
        });
    </script>
</body>
</html>
